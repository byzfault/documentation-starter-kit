<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How the agentic content designer processes a screen</title>
  <desc id="d">The original copy is frozen. Several detectors read it in parallel and report findings. One precedence table resolves conflicts. One writer rewrites each screen once. A code sweep applies the mechanical rules. A fact check and an independent grader verify the result before it is applied to the design file.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- row labels -->
  <text x="30" y="38" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">READ</text>
  <text x="330" y="38" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">DECIDE AND WRITE</text>
  <text x="700" y="38" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">CHECK</text>

  <!-- frozen original -->
  <rect x="30" y="180" width="130" height="92" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="212" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Original copy</text>
  <text x="95" y="234" font-size="13" fill="#334155" text-anchor="middle">frozen and</text>
  <text x="95" y="252" font-size="13" fill="#334155" text-anchor="middle">hashed</text>

  <!-- detectors -->
  <g font-size="13" fill="#0f172a">
    <rect x="200" y="70" width="110" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="255" y="92" text-anchor="middle" font-weight="700">Detector</text>
    <text x="255" y="110" text-anchor="middle">terms</text>
    <rect x="200" y="142" width="110" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="255" y="164" text-anchor="middle" font-weight="700">Detector</text>
    <text x="255" y="182" text-anchor="middle">labels, buttons</text>
    <rect x="200" y="258" width="110" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="255" y="280" text-anchor="middle" font-weight="700">Detector</text>
    <text x="255" y="298" text-anchor="middle">voice</text>
    <rect x="200" y="330" width="110" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="255" y="352" text-anchor="middle" font-weight="700">Detector</text>
    <text x="255" y="370" text-anchor="middle">sentence shape</text>
  </g>
  <text x="255" y="231" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">in parallel,</text>
  <text x="255" y="247" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">findings only</text>

  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M160 205 L196 100"/>
    <path d="M160 215 L196 172"/>
    <path d="M160 238 L196 280"/>
    <path d="M160 248 L196 352"/>
    <path d="M310 96 L346 205"/>
    <path d="M310 168 L346 215"/>
    <path d="M310 284 L346 238"/>
    <path d="M310 356 L346 248"/>
  </g>

  <!-- resolve -->
  <rect x="350" y="180" width="120" height="92" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="410" y="212" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Resolve</text>
  <text x="410" y="234" font-size="13" fill="#334155" text-anchor="middle">one precedence</text>
  <text x="410" y="252" font-size="13" fill="#334155" text-anchor="middle">table</text>

  <path d="M470 226 L496 226" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- writer -->
  <rect x="500" y="180" width="120" height="92" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="560" y="212" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">One writer</text>
  <text x="560" y="234" font-size="13" fill="#334155" text-anchor="middle">one edit</text>
  <text x="560" y="252" font-size="13" fill="#334155" text-anchor="middle">per screen</text>

  <path d="M620 226 L646 226" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- sweep -->
  <rect x="650" y="180" width="120" height="92" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="212" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Code sweep</text>
  <text x="710" y="234" font-size="13" fill="#334155" text-anchor="middle">mechanical rules,</text>
  <text x="710" y="252" font-size="13" fill="#334155" text-anchor="middle">always last</text>

  <!-- verify -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M770 210 L806 130"/>
    <path d="M770 242 L806 322"/>
  </g>
  <rect x="810" y="80" width="124" height="92" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="872" y="112" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Fact check</text>
  <text x="872" y="134" font-size="13" fill="#334155" text-anchor="middle">original against</text>
  <text x="872" y="152" font-size="13" fill="#334155" text-anchor="middle">final, in code</text>

  <rect x="810" y="280" width="124" height="92" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="872" y="312" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Grader</text>
  <text x="872" y="334" font-size="13" fill="#334155" text-anchor="middle">has not seen the</text>
  <text x="872" y="352" font-size="13" fill="#334155" text-anchor="middle">writer's work</text>

  <!-- legend -->
  <rect x="30" y="420" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="54" y="433" font-size="13" fill="#334155">Code: same input, same output</text>
  <rect x="270" y="420" width="16" height="16" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="294" y="433" font-size="13" fill="#334155">Model: judgment</text>
  <rect x="430" y="420" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="454" y="433" font-size="13" fill="#334155">Data</text>
  <text x="930" y="433" font-size="13" fill="#64748b" text-anchor="end">Only the writer and the code sweep change copy</text>
</svg>
